<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aktivasi Kartu PINGO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f4f8ff; }
    .pingo-gradient { background: linear-gradient(135deg, #021447 0%, #052c8f 55%, #0066ff 100%); }
    .pingo-btn { background: linear-gradient(135deg, #052c8f 0%, #0066ff 100%); }
    .pingo-btn:hover { background: linear-gradient(135deg, #021b60 0%, #0052cc 100%); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex items-center justify-center bg-white md:bg-transparent relative">

  <!-- TOAST NOTIFICATION -->
  <div id="toast-box" class="fixed top-5 right-5 z-[100] hidden max-w-sm px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 text-xs font-medium transition-all">
    <i id="toast-icon" data-lucide="check-circle-2" class="w-4 h-4"></i>
    <span id="toast-text">Notifikasi</span>
  </div>

  <div class="hidden md:block absolute inset-0 pingo-gradient"></div>
  
  <div class="relative z-10 bg-white w-full h-full md:h-auto md:max-h-[95vh] md:max-w-[420px] md:rounded-[2rem] md:shadow-2xl flex flex-col px-6 py-4 md:px-10 md:py-6 border-0 md:border border-sky-100 overflow-y-auto overflow-x-hidden no-scrollbar">
    
    <div class="absolute top-[-50px] left-[-50px] w-48 h-48 bg-sky-50 rounded-full mix-blend-multiply blur-2xl opacity-60 md:hidden z-0"></div>
    <div class="absolute top-[-20px] right-[-50px] w-40 h-40 bg-blue-50 rounded-full mix-blend-multiply blur-2xl opacity-60 md:hidden z-0"></div>

    <div class="w-full max-w-sm mx-auto space-y-4 relative z-10 flex-1 flex flex-col justify-center my-auto">
      
      <div class="text-center pt-0">
        <img src="login.png.png" alt="PINGO Logo" class="w-20 h-20 md:w-24 md:h-24 mx-auto object-contain relative z-10 drop-shadow-md" />
        <div class="mt-[-12px] md:mt-[-14px] flex flex-col items-center">
          <img src="tipografi.png" alt="PINGO Text Branding" class="w-36 md:w-40 mx-auto object-contain" />
        </div>
      </div>

      <div class="text-center space-y-0.5 mt-1">
        <h2 class="text-[20px] md:text-[22px] font-extrabold text-[#021859] tracking-tight">Aktivasi Kartu</h2>
        <p class="text-[12px] md:text-[13px] text-slate-500 font-medium">Lengkapi profil bisnis untuk mengaktifkan kartu</p>
      </div>

      <!-- KOTAK ID KARTU TERKUNCI -->
      <div class="relative flex items-center border border-slate-200 rounded-[14px] bg-slate-50 shadow-sm mt-2 mb-1">
        <div class="pl-4 pr-3 text-slate-400"><i data-lucide="hash" class="w-5 h-5"></i></div>
        <div class="h-6 w-px bg-slate-200"></div>
        <input type="text" id="display-code-input" readonly title="ID Kartu bawaan pabrik" class="w-full pl-3 pr-4 py-2.5 bg-transparent text-[13px] font-mono font-extrabold tracking-widest outline-none text-slate-500 cursor-not-allowed" />
      </div>

      <!-- FORM DENGAN PENGUNCI REFRESH -->
      <form id="activation-form" class="space-y-3 pt-1" action="javascript:void(0);">
        
        <div class="relative flex items-center border border-slate-200 rounded-[14px] bg-white focus-within:border-[#0066ff] focus-within:ring-2 focus-within:ring-blue-100 transition-all shadow-sm">
          <div class="pl-4 pr-3 text-[#052c8f]"><i data-lucide="store" class="w-5 h-5"></i></div>
          <div class="h-6 w-px bg-slate-200"></div>
          <input type="text" id="act-name" required placeholder="Nama Kafe / Bisnis" class="w-full pl-3 pr-4 py-2.5 bg-transparent text-[13px] font-medium outline-none text-slate-700 placeholder:font-normal" />
        </div>
        
        <div class="relative flex items-center border border-slate-200 rounded-[14px] bg-white focus-within:border-[#0066ff] focus-within:ring-2 focus-within:ring-blue-100 transition-all shadow-sm">
          <div class="pl-4 pr-3 text-[#052c8f]"><i data-lucide="mail" class="w-5 h-5"></i></div>
          <div class="h-6 w-px bg-slate-200"></div>
          <input type="email" id="act-email" required placeholder="Email Anda (Untuk akses Login)" class="w-full pl-3 pr-4 py-2.5 bg-transparent text-[13px] font-medium outline-none text-slate-700 placeholder:font-normal" />
        </div>
        
        <div class="relative flex items-center border border-slate-200 rounded-[14px] bg-white focus-within:border-[#0066ff] focus-within:ring-2 focus-within:ring-blue-100 transition-all shadow-sm">
          <div class="pl-4 pr-3 text-[#052c8f]"><i data-lucide="map-pin" class="w-5 h-5"></i></div>
          <div class="h-6 w-px bg-slate-200"></div>
          <input type="url" id="act-url" required placeholder="Tautan Bagikan Google Maps" class="w-full pl-3 pr-4 py-2.5 bg-transparent text-[13px] font-medium outline-none text-slate-700 placeholder:font-normal" />
        </div>

        <div class="pt-2">
            <button type="submit" id="btn-submit" class="w-full py-3 pingo-btn text-white font-bold rounded-xl text-sm transition shadow-md shadow-blue-500/20 flex items-center justify-center gap-2 group">
              <i data-lucide="zap" class="w-4 h-4 text-amber-300"></i>
              <span id="btn-text">Aktifkan Kartu Sekarang</span>
            </button>
        </div>
      </form>

      <div class="pt-3 pb-1 flex flex-col items-center justify-center opacity-60">
        <div class="flex items-center gap-3">
          <div class="h-px w-8 bg-blue-900/20"></div>
          <span class="text-[9px] font-bold text-[#052c8f] tracking-widest uppercase">Developing By Win</span>
          <div class="h-px w-8 bg-blue-900/20"></div>
        </div>
        <span class="text-[8px] text-slate-400 mt-1">v2.1</span>
      </div>
    </div>
  </div>

  <script>
    // Pastikan kode dijalankan setelah semua elemen web selesai dimuat
    document.addEventListener("DOMContentLoaded", () => {
      
      try { lucide.createIcons(); } catch(e) {}

      const SUPABASE_URL = "https://dposmaipgqgbqvhveifa.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwb3NtYWlwZ3FnYnF2aHZlaWZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NzQxNzAsImV4cCI6MjEwODE1MDE3MH0.za8FIv0H4q57x4ZhGcUalJbRKrZUSl9tae5q0lN2A6g";
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      let toastTimer = null;
      function showToast(msg, type) {
        const box = document.getElementById("toast-box");
        const icon = document.getElementById("toast-icon");
        document.getElementById("toast-text").innerText = msg;
        
        box.className = "fixed top-5 right-5 z-[100] max-w-sm px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 text-xs font-medium transition-all " + 
          (type === "success" ? "bg-emerald-50 text-emerald-700 border-emerald-200" : "bg-rose-50 text-rose-700 border-rose-200");
        
        icon.setAttribute("data-lucide", type === "success" ? "check-circle-2" : "alert-circle");
        lucide.createIcons();

        box.classList.remove("hidden");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => box.classList.add("hidden"), 3000);
      }

      const params = new URLSearchParams(window.location.search);
      const cardCode = (params.get("id") || "").trim().toUpperCase();

      if (!cardCode) {
        showToast("Kode kartu tidak ditemukan!", "error");
        setTimeout(() => window.location.replace("index.html"), 2000);
      } else {
        document.getElementById("display-code-input").value = cardCode;
      }

      // Sistem penangkap klik tombol yang anti-refresh
      const form = document.getElementById("activation-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault(); 
        
        const btn = document.getElementById("btn-submit");
        const btnText = document.getElementById("btn-text");
        const originalText = btnText.innerText;
        
        btnText.innerText = "Mengaktifkan...";
        btn.disabled = true;

        const name = document.getElementById("act-name").value.trim();
        const email = document.getElementById("act-email").value.trim().toLowerCase();
        const url = document.getElementById("act-url").value.trim();

        // Kirim Update ke Supabase
        const { data, error } = await supabase
          .from("cards")
          .update({
            owner_email: email,
            label_name: name,
            target_url: url,
            response_mode: "review",
            status: "ACTIVE"
          })
          .eq("card_code", cardCode)
          .select();

        // Validasi Hasil
        if (error || !data || data.length === 0) {
          showToast("Gagal! Pastikan kode kartu sudah dibuat oleh Admin.", "error");
          btnText.innerText = originalText;
          btn.disabled = false;
        } else {
          showToast("Kartu Berhasil Diaktivasi! Mengalihkan...", "success");
          setTimeout(() => {
            window.location.replace("c.html?id=" + cardCode);
          }, 2000);
        }
      });

    });
  </script>
</body>
</html>
